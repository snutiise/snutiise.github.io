name: 외부 링크 점검

# 외부 링크는 남의 사이트가 죽으면 깨진다. CI에서 막으면 관계없는 PR이
# 실패하므로, 주 1회 별도로 돌려 이슈로 남긴다.
on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    name: 외부 링크 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ci.yml 과 같은 이유로 액션은 SHA 로 고정하고, checkout 은 토큰을 남기지 않는다.
      # 이 잡의 토큰은 issues: write 라 .git/config 에 남으면 피해가 더 크다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: 외부 링크 검사
        id: check
        # shell 을 명시해야 Actions 가 bash -eo pipefail 로 돌린다. 기본 셸(bash -e)은
        # pipefail 이 없어 '| tee' 가 htmlproofer 의 실패를 0 으로 덮었다. 그래서
        # 2026-08-31 부터 6주 동안 시작하자마자 죽으면서도 매번 초록이었다.
        # continue-on-error 도 뺐다. 실패하면 실행 자체가 빨갛게 보이고, 아래
        # 단계가 이슈를 남긴다.
        shell: bash
        run: |
          # ci.yml 과 같은 이유로 메이저 버전을 고정한다.
          gem install html-proofer -v "~> 5.0" --no-document --silent
          # 여기는 외부 링크까지 본다. 리포트 34개가 인용하는 논문·블로그
          # 링크 수백 개가 남의 사정으로 깜빡이면 매주 이슈만 쌓인다.
          # feed-research 의 내부 링크는 ci.yml 이 매 푸시마다 검사한다.
          # 옵션 이름은 html-proofer 5 의 것이다(--typhoeus-config 는 없는 옵션이라
          # OptionParser::InvalidOption 으로 죽었다). 5.2.2 configuration.rb 로 확인했다.
          htmlproofer _site \
            --ignore-missing-alt \
            --ignore-files "/feed-research/" \
            --allow-missing-href \
            --no-enforce-https \
            --typhoeus '{"timeout":20,"connecttimeout":10}' \
            2>&1 | tee proofer.log
      - name: 실패 시 이슈 생성
        # 검사 단계가 실패했을 때만 돈다(빌드가 먼저 죽으면 proofer.log 가 없다).
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 같은 제목의 열린 이슈가 있으면 중복 생성하지 않는다.
          TITLE="깨진 외부 링크 점검 실패"
          if [ -z "$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE ($(date +%Y-%m-%d))" \
              --body "$(printf '주간 외부 링크 점검에서 실패가 나왔습니다.\n\n```\n%s\n```' "$(tail -40 proofer.log)")"
          fi
