name: CI

on:
  pull_request:
  push:
    branches: [master]

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 이 워크플로는 빌드·검사만 한다. GITHUB_TOKEN 이 저장소 기본값(오래된
# 저장소는 read/write)을 받으면, 락파일 없이 매번 새로 해석되는 gem 의
# 네이티브 확장(extconf.rb 는 설치 시점에 돈다)이 쓰기 권한 있는 토큰과 같은
# 러너에서 실행된다. 읽기로 좁힌다.
permissions:
  contents: read

jobs:
  build:
    name: Jekyll 빌드 & 사이트 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 액션은 커밋 SHA 로 고정한다. 태그(@v4)는 상류에서 다른 커밋으로 옮길 수
      # 있어서, 태그가 침해되면 다음 실행부터 바로 러너에서 돈다. 옆 주석의
      # 버전은 .github/dependabot.yml 이 SHA 와 함께 올린다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 이 워크플로는 git push 를 하지 않는다. 기본값(true)은 GITHUB_TOKEN 을
          # .git/config 에 남겨 뒤 단계의 gem(매번 새로 해석된다)이 읽을 수 있다.
          persist-credentials: false

      # github-pages gem 이 Pages 빌더와 같은 Jekyll/플러그인 버전을 고정한다.
      # 즉 여기서 통과하면 실제 배포 빌드도 통과한다.
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Jekyll 빌드
        # JEKYLL_ENV=production 이어야 배포 때와 같은 경로를 탄다.
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # 빌드 성공만으로는 아무것도 보장되지 않는다. site.url 미설정으로 모든
      # 절대 URL이 깨져 있어도 Jekyll 빌드는 성공했다 — 그래서 산출물을 검사한다.
      - name: 사이트 검사
        run: ./scripts/test-site.sh _site

      - name: 링크 검사 (내부)
        # 외부 링크는 남의 사이트 사정으로 깜빡여서 CI를 불안정하게 만든다.
        # 내부 링크·이미지 깨짐만 막는다.
        run: |
          # 메이저 버전을 고정한다. html-proofer 는 4→5 에서 플래그 이름을
          # 갈아엎었다 — 핀이 없으면 남의 릴리스가 우리 CI 를 깬다.
          gem install html-proofer -v "~> 5.0" --no-document --silent
          # --swap-urls 는 쓰지 않는다: 값이 pattern:replacement 인데 URL 안의
          # '://' 가 구분자로 먹혀 https://octodex... 같은 정상 링크를
          # //snutiise.github.io://octodex... 로 망가뜨린다(오탐 유발).
          # feed-research/ 도 검사한다. 다른 파이프라인 산출물이라 빼 뒀더니
          # 이전 리포트로 가는 앵커 12개가 404 인 채로 배포되고 있었다.
          # 외부 링크는 --disable-external 로 막혀 있어 내부 참조만 본다.
          htmlproofer _site \
            --disable-external \
            --ignore-missing-alt \
            --allow-missing-href \
            --no-enforce-https

      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: |
            _site
          retention-days: 5
