# 워크플로의 액션을 커밋 SHA 로 고정했다(태그는 상류에서 옮길 수 있다).
# SHA 고정은 그대로 두면 낡으므로 Dependabot 이 SHA 와 옆 주석의 버전을 함께 올린다.
# npm 은 넣지 않는다. 쓰이지 않던 npm/gulp 툴체인은 저장소에서 지웠다.
# PR 이 쌓이지 않게 한 달에 한 번, 액션 갱신을 PR 하나로 묶는다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
