# Site settings
title: 0x00 - NULL
description: "snutiise git blog"
baseurl: ""
url: "https://snutiise.github.io"

# User settings
# user_title·gplus_username·linkedin_public_url·projects 는 지웠다. 어떤 템플릿도
# 읽지 않았다(linkedin·projects 는 HTML 주석 처리된 블록 안에서만 참조됐다).
username: snutiise
email: snutiise@hanmail.net
twitter_username: snutiise
github_username:  snutiise
disqus_username: snutiise

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
# github-pages gem 은 theme 이 없으면 jekyll-theme-primer 를 기본으로 켜고,
# 그 테마의 assets/css/style.css(76KB)를 아무도 참조하지 않는데 배포한다.
# 이 사이트는 레이아웃·인클루드를 전부 자체 파일로 쓰고 _sass 도 없어서
# 테마에서 가져다 쓰는 게 없다. null 은 pages-gem 이 명시적으로 허용하는
# 끄는 방법이다(lib/github-pages/configuration.rb effective_config).
theme: null

# 빌드 도구·개발 파일은 산출물에 넣지 않는다.
# vendor 는 CI 의 bundler-cache 가 gem 을 푸는 곳인데, 빼지 않으면 Jekyll 이
# jekyll gem 자체의 site_template 포스트를 파싱하려다 빌드가 깨진다.
exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts
  # front matter 가 없어 StaticFile 로 복사돼 /README.md 로 서빙되던 파일.
  - README.md
