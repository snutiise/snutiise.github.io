# Site settings
title: 0x00 - NULL
description: "snutiise git blog"
baseurl: ""
url: "https://snutiise.github.io"

# User settings
# user_title·gplus_username·linkedin_public_url·projects 는 지웠다. 어떤 템플릿도
# 읽지 않았다(linkedin·projects 는 HTML 주석 처리된 블록 안에서만 참조됐다).
username: snutiise
email: snutiise@hanmail.net
twitter_username: snutiise
github_username:  snutiise
disqus_username: snutiise
# 홈 헤더(.person img)에서 130px 로 표시되므로 2x 화면 기준 260px 면 충분하다.
# s=460 은 48KB 로 홈 첫 로드 전송량의 절반 가까이를 차지했다(s=260 은 17KB).
# avatars3 는 옛 별칭이고 avatars 가 정식 호스트다.
profile_picture: https://avatars.githubusercontent.com/u/10993678?s=260&v=4

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
# 글 날짜는 전부 시간대 없이 적혀 있다(예: 2020-12-03 23:00:00). 시간대를 정하지 않으면
# CI 러너의 UTC 로 읽고 UTC 로 내보내서, 피드·사이트맵·<time> 의 +00:00 이 실제 작성
# 시각(KST)과 9시간 어긋났다. 읽기와 표시가 같은 시간대라 화면의 날짜는 바뀌지 않는다.
timezone: Asia/Seoul
# github-pages gem 은 theme 이 없으면 jekyll-theme-primer 를 기본으로 켜고,
# 그 테마의 assets/css/style.css(76KB)를 아무도 참조하지 않는데 배포한다.
# 이 사이트는 레이아웃·인클루드를 전부 자체 파일로 쓰고 _sass 도 없어서
# 테마에서 가져다 쓰는 게 없다. null 은 pages-gem 이 명시적으로 허용하는
# 끄는 방법이다(lib/github-pages/configuration.rb effective_config).
theme: null

# html minify
compress_html:
  clippings: all
  comments: all
  endings: []
  profile: false

# Links to include in menu navigation
# url 은 끝 슬래시까지 쓴다. 각 페이지는 /posts/index.html 처럼 디렉터리로
# 나가서 /posts 로 링크하면 메뉴를 누를 때마다 301 리다이렉트가 한 번 더 생겼다.
links:
  section_1:
    - title: home
      url: /
      key_trigger: 1
    - title: posts
      url: /posts/
      key_trigger: 2
    - title: series
      url: /series/
      key_trigger: 3
    - title: tags
      url: /tags/
      key_trigger: 4
    - title: about
      url: /about/
      key_trigger: 5
    - title: feed-research
      url: /feed-research/
      key_trigger: 6
  section_2:
    - title: facebook
      url: https://www.facebook.com/Iam.Jeon.Seung.1
      key_trigger: f
    - title: github
      url: https://github.com/snutiise
      key_trigger: g

# 빌드 도구·개발 파일은 산출물에 넣지 않는다.
# vendor 는 CI 의 bundler-cache 가 gem 을 푸는 곳인데, 빼지 않으면 Jekyll 이
# jekyll gem 자체의 site_template 포스트를 파싱하려다 빌드가 깨진다.
exclude:
  # src/ 는 main.css·main.js 의 2018년 원본이다. 다시 빌드하지 않는다(README 참고).
  - src
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts
  # 테마가 딸려 보낸 데모 글. 존재하지 않는 이미지를 참조하고 본인 글도 아니다.
  - sample
  # front matter 가 없어 StaticFile 로 복사돼 /README.md 로 서빙되던 파일.
  - README.md
