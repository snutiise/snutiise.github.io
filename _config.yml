# Site settings
title: 0x00 - NULL
description: "snutiise git blog"
baseurl: ""
url: "https://snutiise.github.io"

# User settings
username: snutiise
user_title: snutiise - Programmer
email: snutiise@hanmail.net
twitter_username: snutiise
github_username:  snutiise
gplus_username:  snutiise
linkedin_public_url: snutiise # Example: For public profile 'www.linkedin.com/in/john-smith', 'john-smith' is your linkedin_public_url
disqus_username: snutiise
profile_picture: https://avatars3.githubusercontent.com/u/10993678?s=460&v=4

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# html minify
compress_html:
  clippings: all
  comments: all
  endings: []
  profile: false

# Links to include in menu navigation
links:
  section_1:
    - title: home
      url: /
      key_trigger: 1
    - title: posts
      url: /posts
      key_trigger: 2
    - title: series
      url: /series
      key_trigger: 3
    - title: tags
      url: /tags
      key_trigger: 4
    - title: about
      url: /about
      key_trigger: 5
    - title: feed-research
      url: /feed-research/
      key_trigger: 6
  section_2:
    - title: facebook
      url: https://www.facebook.com/Iam.Jeon.Seung.1
      key_trigger: f
    - title: github
      url: https://github.com/snutiise
      new_tab: true
      key_trigger: g

# projects in header index
projects:
  - name: twitter crawler
    url: https://github.com/snutiise/twitter

# 빌드 도구·개발 파일은 산출물에 넣지 않는다.
# vendor 는 CI 의 bundler-cache 가 gem 을 푸는 곳인데, 빼지 않으면 Jekyll 이
# jekyll gem 자체의 site_template 포스트를 파싱하려다 빌드가 깨진다.
exclude:
  - package.json
  - package-lock.json
  - gulpfile.js
  - src
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts
