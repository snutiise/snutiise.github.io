# 공용 템플릿(_layouts/post.html, _includes/post-row.html, _includes/toc.html)의 UI 문자열.
# 페이지 본문(index·posts·series·tags·about)은 언어별 파일에 직접 쓰고, 머리글·바닥글은 feed-research 생성기와
# 바이트가 같아야 해서 _includes/site-header.html·site-footer.html 에 글자 그대로 둔다.
# %n 은 숫자 자리다. {n} 은 못 쓴다 — Liquid 토크나이저는 {{ }} 안의 '}' 하나에서 변수를 끝낸다(liquid 4.0.4 에서 SyntaxError 확인).
ko:
  date: 날짜
  reading: 읽는 시간
  mins: "%n분"
  tags: 태그
  share: 공유
  pager: 이전·다음 글
  prev: ← 이전 글
  next: 다음 글 →
  comments: 댓글
  load_comments: 댓글 보기 (Disqus)
  toc: 목차
en:
  date: Date
  reading: Reading time
  mins: "%n min"
  tags: Tags
  share: Share
  pager: Previous and next posts
  prev: ← Previous
  next: Next →
  comments: Comments
  load_comments: Show comments (Disqus)
  toc: Contents
  original: Translated from
  original_link: Korean
  shared: Comments are shared with the Korean original.
